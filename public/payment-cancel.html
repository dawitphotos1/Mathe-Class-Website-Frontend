<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Canceled - Math Class Platform</title>
  <style>
    body {
      font-family: "Inter", Arial, sans-serif;
      background: #f8f9fb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #333;
    }

    .card {
      background: #fff;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 460px;
      transition: all 0.3s ease;
    }

    h2 {
      color: #d32f2f;
      margin-bottom: 1rem;
    }

    p {
      color: #555;
      margin-bottom: 1.5rem;
    }

    .btn {
      background-color: #2196F3;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
      margin: 0 5px;
    }

    .btn:hover { background-color: #1976D2; }

    .btn-secondary {
      background-color: #4CAF50;
    }

    .btn-secondary:hover { background-color: #43A047; }
  </style>
</head>
<body>
  <div class="card fade-in">
    <h2>❌ Payment Canceled</h2>
    <p>Your payment was canceled or not completed. No charges were made.</p>
    <p>You can return to your courses or try again later.</p>

    <div>
      <button class="btn" onclick="window.location.href='/courses'">
        Browse Courses
      </button>
      <button class="btn btn-secondary" onclick="window.location.href='/my-courses'">
        My Courses
      </button>
    </div>
  </div>
</body>
</html>
