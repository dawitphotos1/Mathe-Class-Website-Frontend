<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful - Math Class Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .success-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }
    .success-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }
    h1 { color: #2ecc71; margin-bottom: 15px; font-size: 2.5rem; }
    .status-message {
      margin: 20px 0;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
    }
    .status-processing { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
    .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .buttons { display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
    .btn {
      padding: 15px 25px; border-radius: 10px; text-decoration: none;
      font-weight: bold; transition: all 0.3s ease; border: none;
      cursor: pointer; display: inline-block; text-align: center;
      min-width: 180px; font-size: 1rem;
    }
    .btn-primary { background: #3498db; color: white; }
    .btn-primary:hover { background: #2980b9; transform: translateY(-2px); }
    .btn-secondary { background: #95a5a6; color: white; }
    .btn-secondary:hover { background: #7f8c8d; transform: translateY(-2px); }
    .hidden { display: none; }
    @media (max-width: 768px) {
      .success-container { padding: 25px 20px; }
      h1 { font-size: 2rem; }
      .buttons { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="success-container">
    <div class="success-icon">🎉</div>
    <h1>Payment Successful!</h1>
    
    <div id="statusProcessing" class="status-message status-processing">
      ⏳ Processing your enrollment...
    </div>
    
    <div id="statusSuccess" class="status-message status-success hidden">
      ✅ Enrollment confirmed! You can now access your course.
    </div>
    
    <div id="statusError" class="status-message status-error hidden">
      ❌ There was an issue processing your enrollment. Please contact support.
    </div>

    <div class="buttons">
      <a href="/my-courses" id="successBtn" class="btn btn-primary hidden">Go to My Courses</a>
      <a href="/courses" class="btn btn-secondary">Browse More Courses</a>
      <a href="mailto:support@matheclass.com" class="btn btn-secondary">Contact Support</a>
    </div>
  </div>

  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session_id');
    const courseId = urlParams.get('course_id');

    async function confirmPayment() {
      try {
        console.log('🔁 Confirming payment with:', { sessionId, courseId });
        
        if (!sessionId || !courseId) {
          throw new Error('Missing session ID or course ID');
        }

        // Get the token from cookies
        const getCookie = (name) => {
          const value = `; ${document.cookie}`;
          const parts = value.split(`; ${name}=`);
          if (parts.length === 2) return parts.pop().split(';').shift();
        };

        const token = getCookie('token');
        
        if (!token) {
          throw new Error('Not authenticated. Please log in again.');
        }

        const response = await fetch('/api/v1/payments/confirm', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            sessionId: sessionId,
            courseId: courseId
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to confirm payment');
        }

        console.log('✅ Payment confirmed successfully:', data);
        return data;
      } catch (error) {
        console.error('❌ Payment confirmation failed:', error);
        throw error;
      }
    }

    // Process payment when page loads
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const result = await confirmPayment();
        
        // Show success state
        document.getElementById('statusProcessing').classList.add('hidden');
        document.getElementById('statusSuccess').classList.remove('hidden');
        document.getElementById('successBtn').classList.remove('hidden');
        
        console.log('🎉 Enrollment processed successfully');
      } catch (error) {
        console.error('💥 Enrollment processing failed:', error);
        
        // Show error state
        document.getElementById('statusProcessing').classList.add('hidden');
        document.getElementById('statusError').classList.remove('hidden');
        
        // Update error message with details
        document.getElementById('statusError').innerHTML = 
          `❌ There was an issue: ${error.message}. Please contact support.`;
      }
    });
  </script>
</body>
</html>
