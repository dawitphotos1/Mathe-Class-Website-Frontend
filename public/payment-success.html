<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Success - Math Class Platform</title>
  <style>
    body {
      font-family: "Inter", Arial, sans-serif;
      background: #f7f9fc;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
    }
    .card {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 450px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #eee;
      border-top-color: #4CAF50;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      background-color: #4CAF50;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      margin-top: 1rem;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:hover { background-color: #43a047; }
    .error { color: #d32f2f; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card" id="status-card">
    <h2>Processing Your Enrollment...</h2>
    <div class="spinner"></div>
    <p>Please wait while we confirm your payment.</p>
  </div>

  <script>
    const API_BASE = "https://math-class-backend.onrender.com/api/v1";
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get("session_id");
    const courseId = urlParams.get("course_id");

    const token = localStorage.getItem("token");
    const statusCard = document.getElementById("status-card");

    async function confirmPayment() {
      if (!sessionId || !courseId) {
        statusCard.innerHTML = `<h2 class="error">❌ Invalid payment data</h2>`;
        return;
      }

      try {
        console.log("🔁 Confirming payment with:", { sessionId, courseId });

        if (!token) {
          console.warn("⚠️ No token found — relying on Stripe webhook.");
          showSuccess();
          return;
        }

        const res = await fetch(`${API_BASE}/payments/confirm`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ sessionId, courseId }),
        });

        const data = await res.json();
        if (res.ok) {
          showSuccess();
        } else {
          console.error("❌ Payment confirmation failed:", data.error);
          showError(data.error || "Payment could not be confirmed.");
        }
      } catch (err) {
        console.error("💥 Enrollment processing failed:", err);
        showError("Something went wrong while confirming your payment.");
      }
    }

    function showSuccess() {
      statusCard.innerHTML = `
        <h2>🎉 Payment Successful!</h2>
        <p>Your enrollment has been received and is pending admin approval.</p>
        <button class="btn" onclick="window.location.href='/courses'">Browse More Courses</button>
      `;
    }

    function showError(message) {
      statusCard.innerHTML = `
        <h2 class="error">❌ There was an issue</h2>
        <p>${message}</p>
        <button class="btn" onclick="window.location.href='/courses'">Try Again</button>
      `;
    }

    confirmPayment();
  </script>
</body>
</html>
